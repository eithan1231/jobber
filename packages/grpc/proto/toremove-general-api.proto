syntax = "proto3";

import "base.proto";

package Server;

service GeneralAPI {
  // General
  rpc getJobs (Base.Empty) returns (stream JobItem);
  rpc getJob (GetJobRequest) returns (JobItem);

  rpc getAction (GetActionRequest) returns (ActionItem);
  
  rpc getHttpTriggers (GetTriggerRequest) returns (stream TriggerHttpItem);
  rpc getMqttTriggers (GetTriggerRequest) returns (stream TriggerMqttItem);
  rpc getScheduleTriggers (GetTriggerRequest) returns (stream TriggerScheduleItem);
  rpc getRunners (GetRunnersRequest) returns (stream RunnerItem);


  // Authentication related
  rpc getPublicKeys(Base.Empty) returns (PublicKeysResponse);
  rpc createRunnerJwt (CreateRunnerJwtRequest) returns (CreateRunnerJwtResponse);


  // Gateway Specific 
  rpc createRunner(CreateRunnerRequest) returns (RunnerItem);
  rpc getGatewayConfig(Base.Empty) returns (GetGatewayConfigResponse);
}

message GetJobRequest {
  string id = 1;
}

message GetActionRequest {
  string jobId = 1;
  optional string versionId = 2;
  optional string actionId = 3;
}

message GetTriggerRequest {
  string jobId = 1;
  optional string versionId = 2;
  optional string triggerId = 3;
}

message GetRunnersRequest {
  optional string jobId = 1;
  optional string versionId = 2;
  optional string actionId = 3;
}

message CreateRunnerRequest {
  string jobId = 1;
  string versionId = 2;
}

message PublicKeysResponse {
  repeated string publicKeys = 1;
}

message CreateRunnerJwtRequest {
  enum Scope {
    RUNNER_EVENT_HTTP = 0;
    RUNNER_EVENT_MQTT = 1;
    RUNNER_EVENT_SCHEDULE = 2;
  }

  string runnerId = 1;
  repeated Scope scopes = 2;
}

message CreateRunnerJwtResponse {
  string jwt = 1;
}

message GetGatewayConfigResponse {
  message Item {
    JobItem job = 1;
    ActionItem action = 2;
    repeated TriggerHttpItem httpTriggers = 3;
    repeated RunnerItem runners = 4;
  }

  repeated Item items = 1;
}


// General Types

enum JobStatus {
  ENABLED = 0;
  DISABLED = 1;
}


message JobItem {
  string id = 1;
  string jobName = 2;
  optional string versionId = 3;

  JobStatus status = 4;
}

enum ActionRunnerMode {
  STANDARD = 0;
  RUN_ONCE = 1;
}

message ActionItem {
  string id = 1;
  bool runnerAsynchronous = 2;
  uint32 runnerMinCount = 3;
  uint32 runnerMaxCount = 4;
  uint32 runnerTimeout = 5;
  uint32 runnerMaxIdleAge = 6; 
  uint32 runnerMaxAge = 7;
  uint32 runnerMaxAgeHard = 8;
  ActionRunnerMode runnerMode = 9;
}


message TriggerHttpItem {
  string id = 1;
  string jobId = 2;
  string jobVersionId = 3;

  optional string name = 4;
  optional string method = 5;
  optional string hostname = 6;
  optional string path = 7;

  uint64 createdAt = 8;
}

message TriggerMqttItem {
  string id = 1;
  string jobId = 2;
  string jobVersionId = 3;

  optional string name = 4;
  repeated string topics = 5;
  optional string protocol = 6;
  optional string port = 7;
  optional string host = 8;
  optional string username = 9;
  optional string password = 10;
  optional string clientId = 11;

  uint64 createdAt = 12;
}

message TriggerScheduleItem {
  string id = 1;
  string jobId = 2;
  string jobVersionId = 3;

  optional string name = 4;
  string cron = 5;
  optional string timezone = 6;

  uint64 createdAt = 7; 
}

enum RunnerStatus {
  STARTING = 0;
  READY = 1;
  CLOSING = 2;
  CLOSED = 3;
}

message RunnerItem {
  string id = 1;
  string jobId = 2;
  string jobVersionId = 3;
  string actionId = 4;

  RunnerStatus status = 5;

  string ip = 6;
  string hostname = 7;
  uint32 port = 8;

  reserved 9;

  uint64 createdAt = 10;
  optional uint64 readyAt = 11;
  optional uint64 closingAt = 12;
  optional uint64 closedAt = 13;
}




service RunnerManagement {
  rpc storeGet (StoreGetRequest) returns (StoreItem);
  rpc storeSet (StoreSetRequest) returns (StoreItem);
  rpc storeDelete (StoreDeleteRequest) returns (StoreItem);
  rpc mqttPublish (MqttPublishRequest) returns (Base.Empty);

  // Backend management methods
  rpc init(InitRequest) returns (InitResponse);
  rpc archive(Base.Empty) returns (stream Base.ExportChunk);
}

message StoreGetRequest {
  string key = 1;
}

message StoreSetRequest {
  string key = 1;
  string value = 2;
  uint64 ttl = 3;
}

message StoreDeleteRequest {
  string key = 1;
}

message StoreItem {
  string key = 1;
  string value = 2;
  uint64 expiry = 3;
  uint64 createdAt = 4;
  uint64 modified = 5;
}

message MqttPublishRequest {
  string topic = 1;
  bytes payload = 2;
}

message InitRequest {
  string token = 1;
}

message InitResponse {
  enum Status {
    SUCCESS = 0;
    FAILURE_GENERIC = 1;
  }
}
