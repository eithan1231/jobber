syntax = "proto3";

import "basics/common.proto";

package Environment;

message Item {
  message ContextValue {
    enum Type {
      TEXT = 0;
      SECRET = 1;
    }

    Type type = 1;
    optional string value = 2;
  }

  string id = 1;
  string jobId = 2;
  
  map<string, ContextValue> context = 3;
  
  string modified = 4;
}
