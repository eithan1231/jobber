syntax = "proto3";

import "base.proto";

package RunnerAPI;

service RunnerAPI {
  rpc eventHttp(stream EventHttpRequest) returns (stream EventHttpResponse);
  rpc eventMqtt(EventMqttRequest) returns (EventMqttResponse);
  rpc eventSchedule(EventScheduleRequest) returns (EventScheduleResponse);

  rpc status(Base.Empty) returns (StatusResponse);
}

message BasicContext {
  string triggerName = 1;
  reserved 2 to 10;
}

message HttpHeader {
  string name = 1;
  string value = 2;
}

message EventHttpRequest {
  message Head {
    string id = 1;
    string method = 2;
    string scheme = 3;
    string hostname = 4;
    string path = 5;
    string query = 6;
    reserved 7 to 10;
    repeated HttpHeader headers = 11;
  }

  message Body {
    string id = 1;
    uint64 seq = 2;
    bytes data = 3;
    bool end = 4;
    reserved 5 to 8;
  }

  oneof event {
    BasicContext info = 1;
    Head head = 2;
    Body body = 3;
  }
}


message EventHttpResponse {
  message Head {
    string id = 1;
    int32 status = 2;
    repeated HttpHeader headers = 3;
  }

  message Body {
    string id = 1;
    uint64 seq = 2;
    bytes data = 3;
    bool end = 4;
  }

  oneof event {
    Head head = 1;
    Body body = 2;
  }
}

message EventMqttRequest {
  BasicContext context = 1;
  string topic = 2;
  bytes payload = 3;
}

message EventMqttResponse {
  enum Status {
    ACCEPTED = 0;
    REJECTED = 1;
  }

  Status status = 1;
}

message EventScheduleRequest {
  BasicContext context = 1;
  string id = 2;
  string name = 3;
}

message EventScheduleResponse {
  enum Status {
    ACCEPTED = 0;
    REJECTED = 1;
  }

  Status status = 1;
}


message StatusResponse {
  enum Status {
    STARTING = 0;
    READY = 1;
    CLOSING = 2;
    CLOSED = 3;
    FATAL = 4;
  }

  Status status = 1;
  uint32 lastRequestAt = 2;
  uint32 loadAverage5Seconds = 3;
  uint32 loadAverage1Minute = 4;
}
